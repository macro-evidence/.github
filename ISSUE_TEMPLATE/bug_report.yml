name: Bug report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check existing issues first to avoid duplicates.
  - type: input
    id: repository
    attributes:
      label: Affected repository
      description: Which repository does this affect?
      placeholder: e.g. macro-data-observatory
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and any relevant package versions.
      placeholder: |
        - OS:
        - Python:
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct (https://github.com/macro-evidence/.github/blob/main/CODE_OF_CONDUCT.md)
          required: true
