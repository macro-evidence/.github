name: Feature request
description: Suggest an idea or enhancement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Given the current single-maintainer stage, please open an issue before submitting a large pull request for this.
  - type: input
    id: repository
    attributes:
      label: Affected repository
      placeholder: e.g. macro-data-observatory
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
